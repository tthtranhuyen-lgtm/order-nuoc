    <script>
      // Compatibility shim for Chrome extensions and third-party interceptors attempting to set window.fetch
      try {
        let _activeFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return _activeFetch;
          },
          set: function (fn) {
            _activeFetch = fn;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (_) {}

      // Suppress unhandled errors originating from chrome-extension scripts
      window.addEventListener('error', function (e) {
        if (
          (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
          (e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1)
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    </script>
